server.port=0

spring.datasource.url=jdbc:mysql://localhost:3307/reservas?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cloud.discovery.enabled=true
spring.cloud.inetutils.preferred-networks=192.168, 10, 172

resilience4j.circuitbreaker.instances.verificarDisponibilidadeQuadra.slidingWindowSize=3
resilience4j.circuitbreaker.instances.verificarDisponibilidadeQuadra.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.verificarDisponibilidadeQuadra.waitDurationInOpenState=50s

resilience4j.circuitbreaker.instances.interditarQuadraRemota.slidingWindowSize=3
resilience4j.circuitbreaker.instances.interditarQuadraRemota.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.interditarQuadraRemota.waitDurationInOpenState=50s